<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400">
  <defs>
    <linearGradient id="tbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b2a2f"/>
      <stop offset="1" stop-color="#05252c"/>
    </linearGradient>
    <linearGradient id="tcard" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0e464f"/>
      <stop offset="1" stop-color="#08343c"/>
    </linearGradient>
  </defs>
  <rect width="640" height="400" fill="url(#tbg)"/>

  <!-- top bar -->
  <rect x="40" y="22" width="560" height="44" rx="14" fill="none" stroke="#197686"/>
  <rect x="58" y="34" width="24" height="20" rx="5" fill="#24a0b5"/>
  <rect x="90" y="40" width="70" height="8" rx="4" fill="#ffffff"/>
  <g fill="#b3b3b3"><rect x="250" y="40" width="40" height="8" rx="4"/><rect x="305" y="40" width="50" height="8" rx="4"/><rect x="370" y="40" width="60" height="8" rx="4"/></g>
  <rect x="490" y="32" width="96" height="24" rx="12" fill="#ffffff"/>
  <text x="538" y="48" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" fill="#0a0c11">MY TICKETS →</text>

  <!-- step header -->
  <text x="40" y="100" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#ffffff">Ready</text>
  <text x="600" y="100" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="end" fill="#fafafa">Step 3/3</text>
  <rect x="40" y="110" width="560" height="4" rx="2" fill="#0e464f"/>
  <rect x="40" y="110" width="560" height="4" rx="2" fill="#24a0b5"/>

  <!-- ticket -->
  <g transform="translate(200 128)">
    <path d="M0 14 Q0 0 14 0 H226 Q240 0 240 14 V180 Q228 180 228 192 Q228 204 240 204 V236 Q240 250 226 250 H14 Q0 250 0 236 V204 Q12 204 12 192 Q12 180 0 180 Z" fill="url(#tcard)" stroke="#24a0b5" stroke-width="1.5"/>
    <text x="120" y="30" font-family="Georgia, serif" font-size="22" font-weight="bold" text-anchor="middle" fill="#ffffff">Techember Fest ”25</text>
    <text x="120" y="48" font-family="Segoe UI, Arial, sans-serif" font-size="8" text-anchor="middle" fill="#ffffff">📍 04 Rumens road, Ikoyi, Lagos</text>
    <text x="120" y="60" font-family="Segoe UI, Arial, sans-serif" font-size="8" text-anchor="middle" fill="#ffffff">📅 March 15, 2025 | 7:00 PM</text>
    <!-- avatar -->
    <rect x="86" y="70" width="68" height="68" rx="12" fill="#24a0b5" stroke="#24a0b5" stroke-width="3"/>
    <circle cx="120" cy="96" r="14" fill="#a0694a"/>
    <path d="M96 138 Q120 108 144 138 Z" fill="#f5a623"/>
    <!-- details grid -->
    <rect x="16" y="146" width="208" height="30" rx="6" fill="#08343c" stroke="#133d44"/>
    <g font-family="Segoe UI, Arial, sans-serif">
      <text x="24" y="157" font-size="6" fill="#b3b3b3">Enter your name</text>
      <text x="24" y="170" font-size="8" font-weight="bold" fill="#ffffff">Miracle Okechukwu</text>
      <text x="124" y="157" font-size="6" fill="#b3b3b3">Ticket Type:</text>
      <text x="124" y="170" font-size="8" font-weight="bold" fill="#ffffff">VIP ACCESS</text>
    </g>
    <!-- barcode -->
    <g fill="#ffffff">
      <rect x="44" y="212" width="3" height="26"/><rect x="50" y="212" width="1.5" height="26"/><rect x="54" y="212" width="4" height="26"/>
      <rect x="61" y="212" width="2" height="26"/><rect x="66" y="212" width="3" height="26"/><rect x="72" y="212" width="1.5" height="26"/>
      <rect x="77" y="212" width="4" height="26"/><rect x="84" y="212" width="2" height="26"/><rect x="89" y="212" width="3" height="26"/>
      <rect x="95" y="212" width="1.5" height="26"/><rect x="100" y="212" width="4" height="26"/><rect x="107" y="212" width="2" height="26"/>
      <rect x="112" y="212" width="3" height="26"/><rect x="118" y="212" width="1.5" height="26"/><rect x="123" y="212" width="4" height="26"/>
      <rect x="130" y="212" width="2" height="26"/><rect x="135" y="212" width="3" height="26"/><rect x="141" y="212" width="1.5" height="26"/>
      <rect x="146" y="212" width="4" height="26"/><rect x="153" y="212" width="2" height="26"/><rect x="158" y="212" width="3" height="26"/>
      <rect x="164" y="212" width="1.5" height="26"/><rect x="169" y="212" width="4" height="26"/><rect x="176" y="212" width="2" height="26"/>
      <rect x="181" y="212" width="3" height="26"/><rect x="187" y="212" width="1.5" height="26"/><rect x="192" y="212" width="4" height="26"/>
    </g>
  </g>

  <!-- buttons -->
  <rect x="40" y="350" width="140" height="32" rx="8" fill="none" stroke="#24a0b5"/>
  <text x="110" y="370" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#24a0b5">Book Another Ticket</text>
  <rect x="460" y="350" width="140" height="32" rx="8" fill="#24a0b5"/>
  <text x="530" y="370" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#ffffff">Download Ticket</text>
</svg>
