<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-label="Student portrait illustration">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b4acb"/>
      <stop offset="1" stop-color="#6d8bff"/>
    </linearGradient>
    <linearGradient id="shirt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f5a623"/>
      <stop offset="1" stop-color="#d48806"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#bg)"/>
  <circle cx="320" cy="80" r="60" fill="#ffffff" opacity="0.08"/>
  <circle cx="60" cy="330" r="80" fill="#ffffff" opacity="0.06"/>
  <!-- body -->
  <path d="M70 400 C80 300 140 270 200 270 C260 270 320 300 330 400 Z" fill="url(#shirt)"/>
  <path d="M170 272 L200 320 L230 272 Z" fill="#ffffff" opacity="0.9"/>
  <!-- neck -->
  <rect x="178" y="225" width="44" height="55" rx="18" fill="#8d5a3b"/>
  <!-- head -->
  <ellipse cx="200" cy="170" rx="72" ry="82" fill="#a0694a"/>
  <!-- hair -->
  <path d="M128 160 C120 95 165 72 205 74 C250 76 282 100 274 160 C268 130 250 112 222 108 C190 104 150 115 128 160 Z" fill="#1c1c28"/>
  <!-- ears -->
  <ellipse cx="128" cy="175" rx="10" ry="16" fill="#8d5a3b"/>
  <ellipse cx="272" cy="175" rx="10" ry="16" fill="#8d5a3b"/>
  <!-- glasses -->
  <g fill="none" stroke="#1c1c28" stroke-width="5">
    <rect x="148" y="158" width="42" height="32" rx="10"/>
    <rect x="210" y="158" width="42" height="32" rx="10"/>
    <path d="M190 172 L210 172"/>
  </g>
  <!-- eyes -->
  <circle cx="169" cy="175" r="5" fill="#1c1c28"/>
  <circle cx="231" cy="175" r="5" fill="#1c1c28"/>
  <!-- smile -->
  <path d="M175 210 Q200 232 225 210" fill="none" stroke="#5a3324" stroke-width="5" stroke-linecap="round"/>
  <!-- laptop sticker -->
  <g transform="translate(250 320)">
    <rect width="70" height="44" rx="8" fill="#ffffff"/>
    <text x="35" y="29" font-family="monospace" font-size="18" font-weight="bold" text-anchor="middle" fill="#2b4acb">&lt;/&gt;</text>
  </g>
</svg>
